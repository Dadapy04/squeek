name = "squeek-api"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

# Production D1 database `squeek` on the dadapy04 account.
[[d1_databases]]
binding = "DB"
database_name = "squeek"
database_id = "21def8b0-69c6-499d-8e04-3ec4c64346ed"
migrations_dir = "migrations"

[vars]
SIWE_DOMAIN = "squeekextract.xyz"
SIWE_URI = "https://squeekextract.xyz"
# Comma-separated. Only the live site. Local tests override this.
CORS_ORIGIN = "https://squeekextract.xyz,https://www.squeekextract.xyz"

# RUN_SECRET is not here. Set it with `wrangler secret put RUN_SECRET`.
# Local tests and `wrangler dev` read server/.dev.vars (see .dev.vars.example).
